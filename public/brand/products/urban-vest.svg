  <rect x="1002" y="104" width="90" height="90" fill="none" stroke="#ef3d31" stroke-width="4" stroke-dasharray="10 8"/>
  <g filter="url(#shadow)"><image href="/brand/products/renders/urban-vest-front.svg" x="105" y="155" width="990" height="1090" preserveAspectRatio="xMidYMid meet"/></g>
  <text x="76" y="1360" fill="#171717" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="800">URBAN UTILITY VEST</text>
