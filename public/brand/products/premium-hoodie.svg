      <stop offset=".64" stop-color="#331512" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fabric" x1=".08" y1="0" x2=".92" y2="1">
