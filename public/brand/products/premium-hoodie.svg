<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">BGD/INK Premium hoodie</title>
  <desc id="desc">Premium technical flat-lay illustration of a heavyweight hoodie with a marked front print surface.</desc>
  <defs>
