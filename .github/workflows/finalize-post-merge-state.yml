name: Finalize post-merge repository state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-post-merge-state.yml

permissions:
  contents: write

concurrency:
  group: finalize-post-merge-state
  cancel-in-progress: true

jobs:
  finalize:
    name: Reconcile main-only status and validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Reconcile post-merge documentation and gate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          root = Path('.')
          merge_sha = '03d78a08febd8428555d6f1b657848f2a520eddc'

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              (root / path).write_text(content.rstrip() + '\n', encoding='utf-8')

          def replace_section(path: str, start: str, end: str | None, replacement: str) -> None:
              content = read(path)
              if end is None:
                  pattern = re.compile(rf'{re.escape(start)}\n.*\Z', re.S)
              else:
                  pattern = re.compile(rf'{re.escape(start)}\n.*?(?=\n{re.escape(end)}\n)', re.S)
              updated, count = pattern.subn(replacement.rstrip(), content, count=1)
              if count != 1:
                  raise RuntimeError(f'{path}: could not replace section {start!r}')
              write(path, updated)

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              if content.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one occurrence of {old!r}')
              write(path, content.replace(old, new, 1))

          replace_section(
              'README.md',
              '## Repository status',
              '## Version and release policy',
              f'''## Repository status

              The authoritative repository state is:

              ```text
              main
              ```

              - `main` contains the complete merged P0–P6 application.
              - PR #6 was squash-merged into `main` as `{merge_sha}`.
              - All superseded P0–P6 phase branches were deleted after the merge.
              - Merged pull requests and validation documents remain the audit record.
              - Start future work from `main` on one intentionally named branch.

              P6.1 through P6.6 are implemented, validated, merged, and consolidated in `main`.''',
          )
          replace_section(
              'README.md',
              '## Local setup',
              '## Validation commands',
              '''## Local setup

              ```bash
              git clone https://github.com/YrFnS/BGD-INK-Studio.git
              cd BGD-INK-Studio
              git checkout main
              git lfs pull
              npm ci --include=dev --no-audit --no-fund
              npm run dev
              ```

              New development and production deployment should use `main` as the authoritative source.''',
          )
          replace_once(
              'README.md',
              'Repository-controlled Vercel and Netlify configuration is branch-neutral. The required production branch is `main`; pull requests may receive isolated preview deployments.',
              'Repository-controlled Vercel and Netlify configuration is branch-neutral. `main` is the only repository branch and the required production source; future pull requests may receive isolated preview deployments.',
          )

          write(
              'tasks.md',
              textwrap.dedent(f'''\
              # BGD/INK Studio — Current Work State

              ## Authoritative branch

              ```text
              main
              ```

              - `main` contains the complete merged P0–P6 application.
              - PR #6 was squash-merged as `{merge_sha}`.
              - All superseded phase branches were deleted after the merge.
              - Pull requests and phase validation documents remain the audit trail.
              - Future work must begin from `main` on one intentionally named branch.

              ## Phase status

              | Phase | Status | Record |
              | --- | --- | --- |
              | P0/P1 | Merged into `main` | PR #1 |
              | P2 | Merged into `main` | PR #2 |
              | P3 | Merged into `main` | PR #3 |
              | P4 | Merged into `main` | PR #4 |
              | P5 | Merged into `main` | PR #5 |
              | P6.1–P6.6 | Merged into `main` and validated | PR #6 and `docs/P6-RUNTIME-STABILITY-PLAN.md` |

              ## Completed consolidation

              - [x] Merge the validated P6 runtime-stability work into `main`.
              - [x] Remove the obsolete P0–P6 phase branches.
              - [x] Preserve phase records through merged pull requests and validation documents.
              - [x] Keep package and lockfile metadata aligned at private version `0.4.0`.
              - [x] Keep runtime, PWA, texture, persistence, and production-performance gates active.
              - [x] Confirm the merged `main` commit builds successfully on Vercel.
              - [x] Reconcile living documentation to the main-only repository state.

              ## Required validation commands

              Run after a clean install:

              ```bash
              npm ci --include=dev --no-audit --no-fund
              npm run verify:p6
              ```

              `verify:p6` executes:

              ```text
              npm run check
              npm run test:e2e
              npm run test:pwa
              npm run test:performance
              ```

              The commands are the source of truth for current validation totals.

              ## Remaining product and release inputs

              These are external product decisions rather than unresolved P6 engineering defects:

              - Confirm in each external provider dashboard that Production Branch is `main`.
              - Confirm no obsolete deploy hook or branch context remains in Netlify or Vercel.
              - Approve the final production domain and indexing configuration.
              - Supply official contact destinations and approved privacy, returns, care, and fulfillment content.
              - Confirm prices, production times, garment specifications, and size charts.
              - Add genuine remaining garment models and physical print calibration.
              - Complete representative physical Android, iPhone, and tablet review.

              ## Product boundary

              The project remains frontend-only and browser-local. It has no backend, account system, remote artwork storage, authoritative inventory, payment processing, real order fulfillment, analytics collection, additional verified garment geometry, or physical print calibration.

              ## Next engineering decision

              Open one new branch from `main` only when a clearly scoped maintenance or product phase is approved. Do not recreate the historical phase stack.
              '''),
          )

          replace_section(
              'docs/DEPLOYMENT.md',
              '## Branch policy',
              '## Repository-controlled build contract',
              f'''## Branch policy

              **Production branch: `main`.**

              ```text
              main   # authoritative production and development source
              ```

              PRs #1–#6 are merged. All superseded phase branches were deleted after PR #6 merged as `{merge_sha}`. Merged pull requests and validation documents preserve the audit history.

              Historical phase branches are not deployment targets and must not be recreated as a stack.''',
          )
          replace_once(
              'docs/DEPLOYMENT.md',
              'PR #6 must remain draft until the final review and provider branch checks are complete.',
              'Preview deployments validate proposed commits only; production remains sourced from `main`.',
          )
          replace_section(
              'docs/DEPLOYMENT.md',
              '## Historical branch cleanup',
              None,
              '''## Historical branch cleanup

              Completed after the P6 merge:

              - PRs #1–#6 remain the audit record.
              - P0–P6 validation documents remain in `main`.
              - All superseded phase branches were deleted.
              - Future work must branch from `main` without recreating the old stack.''',
          )

          replace_section(
              'docs/P6-RUNTIME-STABILITY-PLAN.md',
              '## Status',
              '## Product boundary',
              f'''## Status

              P6.1 through P6.6 are complete, validated, and merged into `main`.

              The clean automated exit suite passed on the reconciled implementation head:

              ```text
              0cbd21ab9c264072f8497ece9e14c25f78fc9aa0
              fix: separate CI validation from provider builds
              ```

              Validated GitHub Actions run:

              ```text
              31308581420
              ```

              Vercel and Netlify pull-request previews completed successfully on that head. PR #6 was subsequently squash-merged into `main` as `{merge_sha}`.

              The final repository state is:

              ```text
              main
              ```

              PRs #1–#6 are merged, and all superseded phase branches were deleted. Merged pull requests and validation documents preserve the history.''',
          )
          replace_once(
              'docs/P6-RUNTIME-STABILITY-PLAN.md',
              '- Keep PR #6 draft until the final review and external provider branch check are complete.',
              '- Keep future maintenance isolated on one branch created from `main`.',
          )
          replace_once(
              'docs/P6-RUNTIME-STABILITY-PLAN.md',
              '- README reflects the authoritative `main` plus single P6 branch.',
              '- README reflects the authoritative main-only repository state.',
          )
          replace_once(
              'docs/P6-RUNTIME-STABILITY-PLAN.md',
              'This pull request does not publish an npm package, create a GitHub release, or approve a production deployment.',
              'The P6 merge does not publish an npm package, create a GitHub release, or by itself approve a production deployment.',
          )
          replace_section(
              'docs/P6-RUNTIME-STABILITY-PLAN.md',
              '## Remaining manual release gate',
              None,
              '''## Remaining external production checks

              P6 engineering and repository consolidation are complete. Before presenting the application as a production service, still confirm:

              - Vercel Production Branch is `main`,
              - Netlify Production Branch is `main`,
              - no obsolete deploy hook or branch context remains,
              - and the production domain, indexing, business content, and physical-device review are approved.''',
          )

          replace_section(
              'docs/P6-6-REPOSITORY-RECONCILIATION.md',
              '## Status',
              '## Reconciliation decisions',
              f'''## Status

              **Complete, validated, merged, and consolidated** in `main`.

              Validated reconciled implementation head:

              ```text
              0cbd21ab9c264072f8497ece9e14c25f78fc9aa0
              fix: separate CI validation from provider builds
              ```

              Validated GitHub Actions run:

              ```text
              31308581420
              ```

              All source/build, functional, PWA, and production-performance jobs passed, and both pull-request preview providers completed successfully.

              PR #6 was squash-merged as `{merge_sha}`, and all superseded phase branches were deleted afterward. This does not by itself create a public production release or alter external Vercel/Netlify Production Branch settings.''',
          )
          replace_section(
              'docs/P6-6-REPOSITORY-RECONCILIATION.md',
              '### Authoritative branch state',
              '### Package and release state',
              f'''### Authoritative branch state

              ```text
              main
              ```

              - PRs #1–#6 are merged.
              - `main` contains the complete P0–P6 application.
              - PR #6 produced squash commit `{merge_sha}`.
              - All superseded phase branches were deleted after their contents were verified as merged.
              - Merged pull requests and validation documents are the audit record.''',
          )
          replace_once(
              'docs/P6-6-REPOSITORY-RECONCILIATION.md',
              '- Provider dashboards retain the external Production Branch setting, which must be manually confirmed before merge/release.',
              '- Provider dashboards retain external Production Branch settings that repository source cannot read; they should be confirmed as `main` before a public production launch.',
          )
          replace_section(
              'docs/P6-6-REPOSITORY-RECONCILIATION.md',
              '## Remaining manual release gate',
              None,
              f'''## Post-merge result

              - PR #6 was reviewed, marked ready, and squash-merged as `{merge_sha}`.
              - All phase branches were deleted; only `main` remains.
              - The complete P6 automated exit suite passed before merge.
              - Vercel built the merged `main` commit successfully.

              External provider dashboard settings, the public production domain, indexing approval, business content, and physical-device validation remain separate production-launch inputs. Repository source does not claim those external decisions have been completed.''',
          )

          write(
              'scripts/check-repository-reconciliation.mjs',
              r'''
              import { readFile } from 'node:fs/promises';
              import path from 'node:path';
              import process from 'node:process';

              const root = process.cwd();
              const read = (relativePath) => readFile(path.join(root, relativePath), 'utf8');

              const files = {
                readme: await read('README.md'),
                tasks: await read('tasks.md'),
                troubleshooting: await read('docs/TROUBLESHOOTING.md'),
                deployment: await read('docs/DEPLOYMENT.md'),
                p6Plan: await read('docs/P6-RUNTIME-STABILITY-PLAN.md'),
                p66: await read('docs/P6-6-REPOSITORY-RECONCILIATION.md'),
                package: await read('package.json'),
                lock: await read('package-lock.json'),
                budgets: await read('src/config/runtime-performance-budgets.json'),
                netlify: await read('netlify.toml'),
                vercel: await read('vercel.json'),
                redirects: await read('public/_redirects'),
                workflow: await read('.github/workflows/ci.yml'),
              };

              const failures = [];
              const requireText = (source, text, message) => {
                if (!source.includes(text)) failures.push(message);
              };
              const requirePattern = (source, pattern, message) => {
                if (!pattern.test(source)) failures.push(message);
              };
              const forbidPattern = (source, pattern, message) => {
                if (pattern.test(source)) failures.push(message);
              };

              let packageJson;
              let lockJson;
              let budgetJson;
              let vercelJson;

              try {
                packageJson = JSON.parse(files.package);
                lockJson = JSON.parse(files.lock);
                budgetJson = JSON.parse(files.budgets);
                vercelJson = JSON.parse(files.vercel);
              } catch {
                failures.push('repository metadata JSON must be valid');
              }

              if (packageJson && lockJson) {
                if (packageJson.private !== true) failures.push('the prototype package must remain private');
                if (packageJson.name !== lockJson.name || packageJson.name !== lockJson.packages?.['']?.name) {
                  failures.push('package and lockfile names must agree');
                }
                if (
                  packageJson.version !== lockJson.version ||
                  packageJson.version !== lockJson.packages?.['']?.version
                ) {
                  failures.push('package and lockfile versions must agree');
                }
                requireText(
                  files.readme,
                  `Current private package version: \`${packageJson.version}\``,
                  'README must state the private package version',
                );
                if (packageJson.scripts?.['check:repository'] !== 'node scripts/check-repository-reconciliation.mjs') {
                  failures.push('package scripts must expose check:repository');
                }
                if (
                  packageJson.scripts?.['verify:p6'] !==
                  'npm run check && npm run test:e2e && npm run test:pwa && npm run test:performance'
                ) {
                  failures.push('package scripts must expose the complete P6 exit sequence');
                }
                requireText(
                  packageJson.scripts?.check ?? '',
                  'npm run check:repository',
                  'check:repository must run inside npm run check',
                );
              }

              if (budgetJson) {
                const values = [
                  budgetJson.timingMs?.homepageInteractiveMedian,
                  budgetJson.timingMs?.routeTransitionMedian,
                  budgetJson.timingMs?.studioReady,
                  budgetJson.timingMs?.largeArtworkReady,
                  budgetJson.timingMs?.constrainedArtworkReady,
                  budgetJson.throttling?.cpuRate,
                ];
                if (values.some((value) => typeof value !== 'number' || value <= 0)) {
                  failures.push('runtime budgets must retain positive production limits');
                }
              }

              const mergeSha = '03d78a08febd8428555d6f1b657848f2a520eddc';
              requirePattern(
                files.readme,
                /The authoritative repository state is:\s*```text\s*main\s*```/,
                'README must show main as the sole authoritative branch',
              );
              requireText(files.readme, mergeSha, 'README must retain the P6 merge commit');
              requireText(
                files.readme,
                'P6.1 through P6.6 are implemented, validated, merged, and consolidated in `main`.',
                'README must state the merged P6 status',
              );
              requireText(files.readme, 'npm run test:performance', 'README must document performance tests');
              requireText(files.readme, 'npm run verify:p6', 'README must document the P6 exit command');
              requireText(files.readme, 'docs/DEPLOYMENT.md', 'README must link deployment guidance');
              requireText(files.readme, 'docs/TROUBLESHOOTING.md', 'README must link troubleshooting');

              requireText(files.tasks, 'All superseded phase branches were deleted', 'tasks must state branch cleanup');
              requireText(
                files.tasks,
                '| P6.1–P6.6 | Merged into `main` and validated |',
                'tasks must state the merged P6 phase status',
              );
              requireText(files.tasks, mergeSha, 'tasks must retain the merge commit');
              requireText(files.tasks, 'Production Branch is `main`', 'tasks must retain provider checks');

              const livingStatus = `${files.readme}\n${files.tasks}`;
              forbidPattern(
                livingStatus,
                /agent\/(?:bgd-ink|p6-runtime-stability)|draft PR #6|PR #6 remains draft|draft and unmerged/i,
                'living status documents must not restore deleted branches or pre-merge P6 claims',
              );
              forbidPattern(
                livingStatus,
                /\b\d+\s+(?:unit\/component\/accessibility tests|functional Chromium journeys|Chromium journeys|production-only PWA Chromium journey)/i,
                'living status documents must not hard-code volatile validation totals',
              );

              requireText(files.troubleshooting, 'Draft schema version is 6', 'troubleshooting must state draft schema 6');
              requireText(files.troubleshooting, 'npm run test:performance', 'troubleshooting must cover performance tests');
              requirePattern(files.troubleshooting, /Reduced motion[\s\S]*demand rendering/i, 'troubleshooting must cover reduced motion');
              requirePattern(files.troubleshooting, /2D fallback[\s\S]*WebGL/i, 'troubleshooting must cover WebGL recovery');
              requireText(files.troubleshooting, '786,432 pixels', 'troubleshooting must retain low-power texture limits');
              requireText(files.troubleshooting, '3,145,728 pixels', 'troubleshooting must retain high texture limits');
              requireText(files.troubleshooting, 'Do not raise a runtime budget', 'troubleshooting must reject budget inflation');

              requireText(files.deployment, 'Production branch: `main`', 'deployment docs must name main as production');
              requireText(files.deployment, 'All superseded phase branches were deleted', 'deployment docs must state branch cleanup');
              forbidPattern(files.deployment, /agent\/(?:bgd-ink|p6-runtime-stability)/, 'deployment docs must not restore phase refs');
              requireText(files.deployment, 'Vercel', 'deployment docs must cover Vercel');
              requireText(files.deployment, 'Netlify', 'deployment docs must cover Netlify');
              requireText(files.deployment, 'VITE_PUBLIC_SITE_URL', 'deployment docs must cover the public URL');
              requireText(files.deployment, 'VITE_INDEXABLE_BUILD', 'deployment docs must cover indexing approval');

              requireText(
                files.p6Plan,
                'P6.1 through P6.6 are complete, validated, and merged into `main`.',
                'the P6 plan must state its merged status',
              );
              requireText(files.p6Plan, mergeSha, 'the P6 plan must retain the merge commit');
              forbidPattern(files.p6Plan, /PR #6 remains draft|draft and unmerged/i, 'the P6 plan must not retain pre-merge status');

              requireText(files.p66, '**Complete, validated, merged, and consolidated**', 'P6.6 must state merged status');
              requireText(files.p66, mergeSha, 'P6.6 must retain the merge commit');
              requireText(files.p66, 'All phase branches were deleted', 'P6.6 must retain branch cleanup');
              requireText(files.p66, '31308581420', 'P6.6 must retain the validated CI run');
              requireText(files.p66, 'version: 0.4.0', 'P6.6 must state the reconciled version');
              requireText(files.p66, 'Production branch: main', 'P6.6 must state the deployment branch decision');

              if (vercelJson) {
                if (vercelJson.framework !== 'vite') failures.push('Vercel must declare Vite');
                if (vercelJson.installCommand !== 'npm ci --include=dev --no-audit --no-fund') {
                  failures.push('Vercel must use the clean locked install command');
                }
                if (vercelJson.buildCommand !== 'npm run build') failures.push('Vercel must use npm run build');
                if (vercelJson.outputDirectory !== 'dist') failures.push('Vercel must publish dist');
                forbidPattern(JSON.stringify(vercelJson), /agent\//, 'Vercel config must be branch-neutral');
              }

              requirePattern(files.netlify, /command\s*=\s*"npm run build"/, 'Netlify must use npm run build');
              requirePattern(files.netlify, /publish\s*=\s*"dist"/, 'Netlify must publish dist');
              requirePattern(files.netlify, /NODE_VERSION\s*=\s*"22\.23\.1"/, 'Netlify must retain pinned Node');
              forbidPattern(files.netlify, /agent\//, 'Netlify config must be branch-neutral');
              requireText(files.redirects, '/* /index.html 200', 'Netlify must retain SPA fallback');
              requirePattern(
                files.workflow,
                /name:\s*Production runtime performance budgets[\s\S]*npm run test:performance/,
                'CI must retain the performance job',
              );

              if (failures.length > 0) {
                console.error('\nRepository reconciliation failed:\n');
                failures.forEach((failure) => console.error(`  - ${failure}`));
                process.exit(1);
              }

              console.log(
                'Repository reconciliation passed: package metadata, main-only branch status, deployment contracts, living claims, troubleshooting, merge evidence, and the P6 exit command agree.',
              );
              ''',
          )

          for path in [
              'README.md',
              'tasks.md',
              'docs/DEPLOYMENT.md',
              'docs/P6-RUNTIME-STABILITY-PLAN.md',
              'docs/P6-6-REPOSITORY-RECONCILIATION.md',
          ]:
              content = read(path)
              if re.search(r'agent/(?:bgd-ink|p6-runtime-stability)|PR #6 remains draft|draft and unmerged', content, re.I):
                  raise RuntimeError(f'{path}: stale pre-merge branch or PR text remains')

          print('Post-merge repository state reconciled.')
          PY

      - name: Format reconciled files
        run: |
          npx prettier --write \
            README.md \
            tasks.md \
            docs/DEPLOYMENT.md \
            docs/P6-RUNTIME-STABILITY-PLAN.md \
            docs/P6-6-REPOSITORY-RECONCILIATION.md \
            scripts/check-repository-reconciliation.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete P6 exit suite
        run: npm run verify:p6

      - name: Commit reconciled main-only state and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-post-merge-state.yml
          git add README.md tasks.md docs/DEPLOYMENT.md docs/P6-RUNTIME-STABILITY-PLAN.md docs/P6-6-REPOSITORY-RECONCILIATION.md scripts/check-repository-reconciliation.mjs
          git commit -m "docs: finalize main-only repository state"
          git push origin HEAD:main
