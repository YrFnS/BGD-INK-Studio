name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finish-foundation:
    name: Finish P0 and P1 once
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/bgd-ink-p0-foundation' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bgd-ink-p0-foundation
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migration when needed
        run: |
          if [[ ! -f src/App.tsx ]]; then
            node scripts/finish-p0-p1.mjs
          else
            echo "P0/P1 source migration is already present."
          fi

      - name: Format generated changes
        run: npm run format

      - name: Validate engineering foundation
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser journeys
        run: npm run test:e2e

      - name: Remove migration-only files
        run: |
          rm -f scripts/finish-p0-p1.mjs finish-p0-p1-error.log
          python - <<'PY'
          from pathlib import Path

          eslint = Path('eslint.config.mjs')
          content = eslint.read_text()
          content = content.replace("      'scripts/finish-p0-p1.mjs',\n", '')
          eslint.write_text(content)
          PY

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches:
                - main
                - 'agent/**'
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              name: Typecheck, lint, unit tests, build, and budgets
              runs-on: ubuntu-latest
              timeout-minutes: 20

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                  with:
                    lfs: true

                - name: Set up Node.js and npm cache
                  uses: actions/setup-node@v4
                  with:
                    node-version-file: .nvmrc
                    cache: npm
                    cache-dependency-path: package-lock.json

                - name: Install locked dependencies
                  run: npm ci --no-audit --no-fund

                - name: Validate application
                  run: npm run check

            e2e:
              name: Desktop and mobile Chromium journeys
              needs: validate
              runs-on: ubuntu-latest
              timeout-minutes: 25

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                  with:
                    lfs: true

                - name: Set up Node.js and npm cache
                  uses: actions/setup-node@v4
                  with:
                    node-version-file: .nvmrc
                    cache: npm
                    cache-dependency-path: package-lock.json

                - name: Install locked dependencies
                  run: npm ci --no-audit --no-fund

                - name: Install Chromium
                  run: npx playwright install --with-deps chromium

                - name: Run browser journeys
                  run: npm run test:e2e

                - name: Upload Playwright report
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: playwright-report
                    path: playwright-report
                    retention-days: 7
          YAML

          npm run format

      - name: Commit completed P0 and P1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete P0 and P1 foundation"
          git push origin HEAD:agent/bgd-ink-p0-foundation

  validate:
    name: Typecheck, lint, unit tests, build, and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: npm run check

  e2e:
    name: Chromium recovery journey
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser journey
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
