name: Finish P0 and P1

on:
  push:
    branches:
      - agent/bgd-ink-p0-foundation
    paths:
      - scripts/finish-p0-p1.mjs
      - .github/workflows/finish-p0-p1.yml

permissions:
  contents: write

concurrency:
  group: finish-p0-p1
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate, validate, and publish P0/P1 completion
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bgd-ink-p0-foundation
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply and validate P0/P1 completion
        id: completion
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            node scripts/finish-p0-p1.mjs
            npm run format
            npm run check
            npx playwright install --with-deps chromium
            npm run test:e2e
          } 2>&1 | tee /tmp/finish-p0-p1.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish validated migration or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ steps.completion.outputs.status }}" != "0" ]]; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/finish-p0-p1.log finish-p0-p1-error.log
            git add finish-p0-p1-error.log
            git commit -m "chore: capture P0 P1 migration failure"
            git push origin HEAD:agent/bgd-ink-p0-foundation
            exit 1
          fi

          rm -f finish-p0-p1-error.log
          git add -A
          git commit -m "complete P0 and P1 foundation"
          git push origin HEAD:agent/bgd-ink-p0-foundation

# Retry marker: one-time migration helper is excluded from the normal lint target.
