name: Finish P0 and P1

on:
  push:
    branches:
      - agent/bgd-ink-p0-foundation
    paths:
      - scripts/finish-p0-p1.mjs
      - .github/workflows/finish-p0-p1.yml

permissions:
  contents: write

concurrency:
  group: finish-p0-p1
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate, validate, and publish P0/P1 completion
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bgd-ink-p0-foundation
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply P0 and P1 completion migration
        run: node scripts/finish-p0-p1.mjs

      - name: Format generated changes
        run: npm run format

      - name: Validate engineering foundation
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser journeys
        run: npm run test:e2e

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete P0 and P1 foundation"
          git push origin HEAD:agent/bgd-ink-p0-foundation
