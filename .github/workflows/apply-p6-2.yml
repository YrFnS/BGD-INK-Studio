name: Apply P6.2 editor refactor

on:
  push:
    branches:
      - agent/p6-runtime-stability

permissions:
  contents: write

concurrency:
  group: apply-p6-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage P6.2 executor')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout P6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p6-runtime-stability
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Decode and apply the P6.2 transformation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/p6-2/apply.mjs.gz.b64 | gzip -d > /tmp/apply-p6-2.mjs
          node --check /tmp/apply-p6-2.mjs
          node /tmp/apply-p6-2.mjs

      - name: Format the focused P6.2 files
        run: |
          npx prettier --write \
            package.json \
            scripts/check-editor-interactions.mjs \
            src/features/customizer/Customizer.tsx \
            src/features/customizer/Scene.tsx \
            src/features/customizer/ShirtModel.tsx \
            src/features/customizer/Controls.tsx \
            src/features/customizer/Controls.test.tsx \
            src/features/customizer/decalTransform.ts \
            src/features/customizer/editorHistory.ts \
            src/features/customizer/editorHistory.test.ts \
            e2e/gesture-history.spec.ts

      - name: Run repository validation
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm run test:e2e

      - name: Run production PWA journey
        run: npm run test:pwa

      - name: Commit validated P6.2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/p6-2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P6.2: decouple live editor gestures from React state"
          git push origin HEAD:agent/p6-runtime-stability
