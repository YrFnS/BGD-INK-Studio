name: Vendor Classic T-shirt model

on:
  push:
    branches:
      - fix/3d-model-and-product-previews
    paths:
      - .github/workflows/vendor-classic-shirt-model.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-classic-shirt-model
  cancel-in-progress: false

jobs:
  vendor:
    name: Commit the approved GLB as a normal Git asset
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch with Git LFS objects
        uses: actions/checkout@v4
        with:
          ref: fix/3d-model-and-product-previews
          fetch-depth: 0
          lfs: true

      - name: Verify the checked-out model is a real GLB
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -c 4 public/basic_t-shirt.glb)" = "glTF"
          test "$(wc -c < public/basic_t-shirt.glb)" -gt 1000000

      - name: Stop filtering the approved model through Git LFS
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.gitattributes')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [
              line
              for line in lines
              if line.strip() != '*.glb filter=lfs diff=lfs merge=lfs -text'
          ]
          lines.append('# Current optimized GLB assets are small enough to remain normal Git files.')
          path.write_text('\n'.join(dict.fromkeys(lines)).strip() + '\n', encoding='utf-8')
          PY

          git rm --cached public/basic_t-shirt.glb
          git add .gitattributes public/basic_t-shirt.glb
          git rm .github/workflows/vendor-classic-shirt-model.yml

          test "$(git show :public/basic_t-shirt.glb | head -c 4)" = "glTF"
          test "$(git cat-file -s :public/basic_t-shirt.glb)" -gt 1000000

      - name: Commit the self-contained model delivery fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: vendor the Classic T-shirt model for every deployment"
          git push origin HEAD:fix/3d-model-and-product-previews
